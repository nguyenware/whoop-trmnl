name = "whoop-trmnl"
main = "index.js"
compatibility_date = "2024-01-01"

# Optional: bind a KV namespace to cache access tokens between requests
# This reduces token refresh calls. Create with:
#   wrangler kv:namespace create "WHOOP_KV"
# Then uncomment and fill in the id:

[[kv_namespaces]]
binding = "WHOOP_KV"
id = "8ecb3e2b11a14df8a3d4552880140e53"

[vars]
# Non-secret vars can go here. Secrets must use `wrangler secret put`.

# Secrets to configure (run these commands):
#   wrangler secret put WHOOP_CLIENT_ID
#   wrangler secret put WHOOP_CLIENT_SECRET
#   wrangler secret put WHOOP_REFRESH_TOKEN
#   wrangler secret put WORKER_API_KEY
